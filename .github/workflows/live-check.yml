name: Check public Mini App
on: workflow_dispatch
permissions: {}
jobs:
  health:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check production frontend and API authentication
        run: |
          origin=https://olympradar.olympradar-worker.workers.dev
          curl -fsS --max-time 25 --retry 2 "$origin/" > /tmp/index.html
          grep -q '<title>OlympRadar' /tmp/index.html
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$origin/api/me")" = 401
