name: Check webhook boundary
on: workflow_dispatch
permissions: {}
jobs:
  health:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check webhook authentication and retired website
        run: |
          origin=https://olympradar.olympradar-worker.workers.dev
          test "$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' "$origin/")" = 404
          test "$(curl -sS --max-time 25 -X POST -o /dev/null -w '%{http_code}' "$origin/telegram")" = 401
